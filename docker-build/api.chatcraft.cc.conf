# /opt/bitnami/nginx/conf/server_blocks/api.chatcraft.cc.conf

# --- Upstream (edit this to your gateway or FastAPI service) ---
# If your gateway runs on the same host/container at port 8080, this is fine.
# Otherwise point to the correct internal DNS name or IP:port.1
upstream backend_gateway {
    server 127.0.0.1:8080;
    keepalive 64;
}

upstream authorization_service {
    server 127.0.0.1:9000;
    keepalive 64;
}

# --- WebSocket helper (safe to declare in this file; it's included inside `http` context) ---
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream minio_api {
    server 127.0.0.1:9000;
    keepalive 16;
}

upstream jaeger_ui {
    server 127.0.0.1:16686;
    keepalive 16;
}

# ---------------------------- Abuse / DDoS controls ----------------------------
# Per-IP request-rate zones (10MB shared memory ~= 160k unique IPs each)
limit_req_zone  $binary_remote_addr zone=req_general:10m  rate=10r/s;   # catch-all "/"
limit_req_zone  $binary_remote_addr zone=req_api:10m      rate=30r/s;   # /api/v1
limit_req_zone  $binary_remote_addr zone=req_auth:10m     rate=5r/s;    # /auth (login bruteforce)
limit_req_zone  $binary_remote_addr zone=req_ws:10m       rate=2r/s;    # WS handshakes
limit_req_zone  $binary_remote_addr zone=req_admin:10m    rate=2r/s;    # /console /jaeger /minio

# Per-IP concurrent connection zone
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# HTTP method allowlist — anything else gets 405 at the edge
map $request_method $bad_method {
    default 1;
    GET     0;
    HEAD    0;
    POST    0;
    PUT     0;
    DELETE  0;
    OPTIONS 0;
    PATCH   0;
}

# Trusted UI origins — soft signal for admin paths only, NOT a security boundary
map $http_origin $is_trusted_ui {
    default                                        0;
    ""                                             1;   # native apps, server-to-server, curl with no Origin
    "~^https://app\.chatcraft\.cc$"                1;
    "~^https://chatcraft-admin\.web\.app$"         1;
    "~^https://chatcraft-admin\.firebaseapp\.com$" 1;
    "~^http://localhost(:[0-9]+)?$"                1;   # dev — drop in production hardening pass
}

# ---------------------------- HTTP (port 80) ----------------------------
server {
    listen 80;
    server_name api.chatcraft.cc;

    # Only allow /api/v1 (exact and subpaths). Deny everything else.
    # Exact match for the bare path (no trailing slash)
    location = /api/v1 {
    	return 301 https://$host$request_uri;
    }

    # Prefix match for any subpath under /api/v1/
    location ^~ /api/v1/ {
    	return 301 https://$host$request_uri;
    }

    # /console (normalize to trailing slash, then HTTPS)
    location = /console {
        return 301 https://$host/console/;
    }

    # /console/ subpaths
    location ^~ /console/ {
        return 301 https://$host$request_uri;
    }

    # New: redirect /ws/chat to HTTPS
    location ^~ /ws/chat {
        return 301 https://$host$request_uri;
    }

    # Authorization subpath
    location = /auth {
	return 301 https://$host/auth/;
    }

    location ^~ /ws/agent/ {
        return 301 https://$host$request_uri;
    }

    # MinIO S3 API
    location ^~ /minio/ {
        return 301 https://$host$request_uri;
    }

    # Jaeger UI
    location = /jaeger {
        return 301 https://$host/jaeger/;
    }

    location ^~ /jaeger/ {
        return 301 https://$host$request_uri;
    }

    # Authorization subpath
    location ^~ /auth/ {
        return 301 https://$host$request_uri;
    }

    # Deny every other request on HTTP
    location / {
        limit_req  zone=req_general burst=5 nodelay;
        limit_conn conn_per_ip      3;
        return 444;  # drop connection silently
    }
}

# ---------------------------- HTTPS (port 443) ----------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name api.chatcraft.cc;

    # Bitnami bncert typically maintains these symlinks:
    ssl_certificate /opt/bitnami/letsencrypt/certificates/api.chatcraft.cc.crt;
    ssl_certificate_key /opt/bitnami/letsencrypt/certificates/api.chatcraft.cc.key;

    # TLS hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Allow file uploads up to 50MB (document ingestion)
    client_max_body_size 50m;

    # --- Slowloris / slow-POST defense ---
    client_header_timeout  10s;
    client_body_timeout    30s;          # uploads to /api/v1/documents need headroom
    send_timeout           30s;
    keepalive_timeout      30s 30s;
    keepalive_requests     100;

    # --- Header-flood defense ---
    client_header_buffer_size    1k;
    large_client_header_buffers  4 8k;
    client_body_buffer_size      16k;

    # --- Method allowlist (uses $bad_method map at top of file) ---
    if ($bad_method) { return 405; }

    # --- Rate-limit response code: 429 is more correct than the default 503 ---
    limit_req_status    429;
    limit_conn_status   429;
    limit_req_log_level warn;

    # --- REST API (no WebSocket — that goes through /ws/chat) ---
    location = /api/v1 {
        limit_req  zone=req_api burst=60 nodelay;
        limit_conn conn_per_ip  20;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 30s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;

        proxy_pass http://backend_gateway;
    }

    location ^~ /api/v1/ {
        limit_req  zone=req_api burst=60 nodelay;
        limit_conn conn_per_ip  20;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 30s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;

        proxy_pass http://backend_gateway;
    }

    # Handle /auth without trailing slash
    location = /auth {
        return 301 https://$host/auth/;
    }

    location ^~ /auth/ {
        limit_req  zone=req_auth burst=10 nodelay;
        limit_conn conn_per_ip   10;

        proxy_http_version 1.1;
	    proxy_set_header Host              $host;
	    proxy_set_header X-Real-IP         $remote_addr;
	    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
	    proxy_set_header X-Forwarded-Proto $scheme;

	    # Additional headers for Spring Authorization Server
	    proxy_set_header X-Forwarded-Host  $host;
	    proxy_set_header X-Forwarded-Port  $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

	    proxy_pass http://127.0.0.1:9002/auth/;
    }

    # ---- /console rewrite ----
    location ^~ /console/ {
        limit_req  zone=req_admin burst=5 nodelay;
        limit_conn conn_per_ip    5;

        # Soft Origin check — silently drop non-UI browsers (scanners, casual probes)
        if ($is_trusted_ui = 0) { return 444; }

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

	    # Let Console know it lives behind /console (some setups read this)
        proxy_set_header X-Forwarded-Prefix /console;

	    proxy_redirect off;
        proxy_buffering off;

	    # WebSocket support if console UI uses it
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_pass http://localhost:9001/;   # notice the trailing slash drops '/console'
    }

    # Exact /console (without trailing slash)
    location = /console {
        return 301 /console/;
    }

    # --- MinIO S3 API (for direct S3-compatible access) ---
    location ^~ /minio/ {
        limit_req  zone=req_admin burst=5 nodelay;
        limit_conn conn_per_ip    5;

        # Soft Origin check — silently drop non-UI browsers
        if ($is_trusted_ui = 0) { return 444; }

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 30s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        client_max_body_size  50m;

        proxy_pass http://minio_api/;
    }

    # --- Jaeger UI (distributed tracing) ---
    location = /jaeger {
        return 301 /jaeger/;
    }

    location ^~ /jaeger/ {
        limit_req  zone=req_admin burst=5 nodelay;
        limit_conn conn_per_ip    5;

        # Soft Origin check — silently drop non-UI browsers
        if ($is_trusted_ui = 0) { return 444; }

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://jaeger_ui/jaeger/;
    }

    # --- WebSocket Chat only ---
    location /ws/chat {
        limit_req  zone=req_ws burst=5 nodelay;
        limit_conn conn_per_ip  5;          # <=5 concurrent chat sockets per IP

        proxy_http_version 1.1;

        # Only accept real WebSocket upgrade requests
       if ($http_upgrade != "websocket") {
            return 403;   # block non-WS requests
       }

       proxy_set_header Upgrade           $http_upgrade;
       proxy_set_header Connection        $connection_upgrade;
       proxy_set_header Host              $host;
       proxy_set_header X-Real-IP         $remote_addr;
       proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
       proxy_set_header X-Forwarded-Proto $scheme;

       proxy_read_timeout  3600s;
       proxy_send_timeout  3600s;

       # Forward to your chat WS backend
       proxy_pass http://localhost:8000;   # adjust port/service
    }

    # --- Agent WebSocket ---
    location /ws/agent/ {
        limit_req  zone=req_ws burst=5 nodelay;
        limit_conn conn_per_ip  5;

        proxy_http_version 1.1;

        if ($http_upgrade != "websocket") {
            return 403;
        }

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;

        proxy_pass http://localhost:8000;
    }

    # Deny every other request on HTTPS
    location / {
       limit_req  zone=req_general burst=5 nodelay;
       limit_conn conn_per_ip      3;
       return 444;
    }
}

